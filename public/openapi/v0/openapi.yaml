openapi: 3.2.0
info:
  title: Taskmigo API
  version: 0.1.0
  summary: Authoring and runtime-inspection API for Taskmigo v0.
  description: |
    Design-first HTTP contract for the currently planned Taskmigo foundation.

    Resource writes are durable authoring operations. Runtime activation is asynchronous:
    a successful Resource write can enqueue a Site candidate, and the current runtime
    remains unchanged until a valid snapshot is compiled and atomically activated.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Resources
    summary: Resource identities and current revisions
  - name: Revisions
    summary: Immutable Resource revision history
  - name: Tags
    summary: Immutable Resource revision selectors
  - name: Candidates
    summary: Site candidate state and validation diagnostics
  - name: Snapshots
    summary: Immutable compiled Site snapshots
  - name: Runtime
    summary: Active Site runtime state

paths:
  /api/v0/resources:
    get:
      tags: [Resources]
      operationId: listResources
      summary: List Resource identities
      parameters:
        - $ref: '#/components/parameters/KindVersionQuery'
        - $ref: '#/components/parameters/KindNameQuery'
        - name: namePrefix
          in: query
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Resource page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v0/resources/{kindVersion}/{kindName}/{name}:
    parameters:
      - $ref: '#/components/parameters/KindVersionPath'
      - $ref: '#/components/parameters/KindNamePath'
      - $ref: '#/components/parameters/ResourceNamePath'
    get:
      tags: [Resources]
      operationId: getResource
      summary: Get a Resource and its current revision metadata
      responses:
        '200':
          description: Resource found
          headers:
            ETag:
              $ref: '#/components/headers/ResourceETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Resources]
      operationId: putResource
      summary: Create a Resource or append a new current revision
      description: |
        The request body is the complete authored manifest source.

        For creation, send `If-None-Match: *`.
        For an existing Resource, send `If-Match` with the ETag returned by the most
        recent GET/PUT. Missing preconditions return 428; stale preconditions return 412.

        If the canonical source checksum is already the current revision checksum, the
        operation is a no-op and returns the existing current revision rather than creating
        duplicate immutable history.

        A successful write commits authoring state. It does not imply that the new source
        is active at runtime. When the change can affect the Site, the response includes the
        queued candidate identifier.
      parameters:
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: Strong ETag of the current Resource revision when updating.
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            enum: ['*']
          description: Must be `*` when creating a Resource that must not already exist.
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
              minLength: 1
          text/yaml:
            schema:
              type: string
              minLength: 1
      responses:
        '200':
          description: Existing Resource updated or identical source treated as a no-op
          headers:
            ETag:
              $ref: '#/components/headers/ResourceETag'
            Location:
              $ref: '#/components/headers/ResourceLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceWriteResult'
        '201':
          description: Resource created
          headers:
            ETag:
              $ref: '#/components/headers/ResourceETag'
            Location:
              $ref: '#/components/headers/ResourceLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceWriteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /api/v0/resources/{kindVersion}/{kindName}/{name}/revisions:
    parameters:
      - $ref: '#/components/parameters/KindVersionPath'
      - $ref: '#/components/parameters/KindNamePath'
      - $ref: '#/components/parameters/ResourceNamePath'
    get:
      tags: [Revisions]
      operationId: listResourceRevisions
      summary: List immutable revisions for one Resource
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Revision page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceRevisionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v0/resources/{kindVersion}/{kindName}/{name}/revisions/{revisionId}:
    parameters:
      - $ref: '#/components/parameters/KindVersionPath'
      - $ref: '#/components/parameters/KindNamePath'
      - $ref: '#/components/parameters/ResourceNamePath'
      - $ref: '#/components/parameters/RevisionIdPath'
    get:
      tags: [Revisions]
      operationId: getResourceRevision
      summary: Get one immutable Resource revision
      responses:
        '200':
          description: Revision found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceRevision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v0/resources/{kindVersion}/{kindName}/{name}/tags:
    parameters:
      - $ref: '#/components/parameters/KindVersionPath'
      - $ref: '#/components/parameters/KindNamePath'
      - $ref: '#/components/parameters/ResourceNamePath'
    get:
      tags: [Tags]
      operationId: listResourceTags
      summary: List immutable tags for one Resource
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Tag page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceTagPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Tags]
      operationId: createResourceTag
      summary: Create an immutable tag pointing at an exact revision
      description: |
        Tags never move. Retrying the same tag-to-revision association returns the
        existing association. Reusing an existing tag for another revision returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceTagRequest'
      responses:
        '200':
          description: Identical tag association already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceTag'
        '201':
          description: Tag created
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceTag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'

  /api/v0/resources/{kindVersion}/{kindName}/{name}/tags/{tag}:
    parameters:
      - $ref: '#/components/parameters/KindVersionPath'
      - $ref: '#/components/parameters/KindNamePath'
      - $ref: '#/components/parameters/ResourceNamePath'
      - name: tag
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      tags: [Tags]
      operationId: getResourceTag
      summary: Get one immutable tag
      responses:
        '200':
          description: Tag found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceTag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v0/site/candidates:
    get:
      tags: [Candidates]
      operationId: listSiteCandidates
      summary: List Site compilation candidates
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SiteCandidateStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Candidate page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteCandidatePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v0/site/candidates/{candidateId}:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    get:
      tags: [Candidates]
      operationId: getSiteCandidate
      summary: Get Site candidate state
      responses:
        '200':
          description: Candidate found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteCandidate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v0/site/candidates/{candidateId}/diagnostics:
    parameters:
      - $ref: '#/components/parameters/CandidateIdPath'
    get:
      tags: [Candidates]
      operationId: listSiteCandidateDiagnostics
      summary: List ordered diagnostics for one candidate
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Diagnostic page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v0/site/snapshots:
    get:
      tags: [Snapshots]
      operationId: listSiteSnapshots
      summary: List immutable Site snapshots
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Snapshot page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSnapshotPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v0/site/snapshots/{snapshotId}:
    parameters:
      - $ref: '#/components/parameters/SnapshotIdPath'
    get:
      tags: [Snapshots]
      operationId: getSiteSnapshot
      summary: Get immutable Site snapshot metadata
      responses:
        '200':
          description: Snapshot found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v0/site/snapshots/{snapshotId}/resources:
    parameters:
      - $ref: '#/components/parameters/SnapshotIdPath'
    get:
      tags: [Snapshots]
      operationId: listSiteSnapshotResources
      summary: List exact Resource revisions pinned by a snapshot
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Snapshot Resource pins
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResourcePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v0/site/runtime:
    get:
      tags: [Runtime]
      operationId: getSiteRuntimeState
      summary: Get the currently active Site runtime pointer
      responses:
        '200':
          description: Runtime state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteRuntimeState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No Site snapshot has been activated yet
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    ResourceETag:
      description: Strong ETag derived from the exact current revision identity.
      schema:
        type: string
    ResourceLocation:
      description: Canonical URI of the Resource.
      schema:
        type: string
        format: uri-reference

  parameters:
    KindVersionPath:
      name: kindVersion
      in: path
      required: true
      description: Version segment of the Resource kind, for example `v0` from `v0/page`.
      schema:
        type: string
        pattern: '^v[0-9]+$'
    KindNamePath:
      name: kindName
      in: path
      required: true
      description: Name segment of the Resource kind.
      schema:
        type: string
        enum: [site, application, page, component, translation]
    ResourceNamePath:
      name: name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 253
    RevisionIdPath:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CandidateIdPath:
      name: candidateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SnapshotIdPath:
      name: snapshotId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KindVersionQuery:
      name: kindVersion
      in: query
      schema:
        type: string
        pattern: '^v[0-9]+$'
    KindNameQuery:
      name: kindName
      in: query
      schema:
        type: string
        enum: [site, application, page, component, translation]
    Cursor:
      name: cursor
      in: query
      description: Opaque continuation token returned by the previous page.
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    BadRequest:
      description: Request syntax or parameter shape is invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is required or the bearer token is invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated Principal is not allowed to perform the operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Requested Resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with a durable invariant
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: The supplied ETag precondition does not match current state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Request body media type is unsupported
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: Source is parseable but cannot form a valid Resource revision
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: A required optimistic-concurrency precondition was not supplied
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    ResourceKind:
      type: string
      enum:
        - v0/site
        - v0/application
        - v0/page
        - v0/component
        - v0/translation

    Resource:
      type: object
      additionalProperties: false
      required: [kind, name, currentRevision, createdAt, updatedAt]
      properties:
        kind:
          $ref: '#/components/schemas/ResourceKind'
        name:
          type: string
        currentRevision:
          $ref: '#/components/schemas/ResourceRevisionSummary'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResourceSummary:
      type: object
      additionalProperties: false
      required: [kind, name, currentRevisionId, createdAt, updatedAt]
      properties:
        kind:
          $ref: '#/components/schemas/ResourceKind'
        name:
          type: string
        currentRevisionId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResourceRevisionSummary:
      type: object
      additionalProperties: false
      required: [id, apiVersion, checksum, createdAt]
      properties:
        id:
          type: string
          format: uuid
        apiVersion:
          type: string
        checksum:
          type: string
          pattern: '^[a-f0-9]{64}$'
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: [string, 'null']

    ResourceRevision:
      type: object
      additionalProperties: false
      required: [id, kind, name, apiVersion, checksum, source, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ResourceKind'
        name:
          type: string
        apiVersion:
          type: string
        checksum:
          type: string
          pattern: '^[a-f0-9]{64}$'
        source:
          type: string
          description: Complete authored manifest source for this immutable revision.
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: [string, 'null']

    ResourceWriteResult:
      type: object
      additionalProperties: false
      required: [resource, revision]
      properties:
        resource:
          $ref: '#/components/schemas/Resource'
        revision:
          $ref: '#/components/schemas/ResourceRevisionSummary'
        candidate:
          oneOf:
            - $ref: '#/components/schemas/QueuedCandidateReference'
            - type: 'null'

    QueuedCandidateReference:
      type: object
      additionalProperties: false
      required: [id, href]
      properties:
        id:
          type: string
          format: uuid
        href:
          type: string
          format: uri-reference

    CreateResourceTagRequest:
      type: object
      additionalProperties: false
      required: [tag, revisionId]
      properties:
        tag:
          type: string
          minLength: 1
        revisionId:
          type: string
          format: uuid

    ResourceTag:
      type: object
      additionalProperties: false
      required: [kind, name, tag, revisionId, createdAt]
      properties:
        kind:
          $ref: '#/components/schemas/ResourceKind'
        name:
          type: string
        tag:
          type: string
        revisionId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: [string, 'null']

    SiteCandidateStatus:
      type: string
      enum: [queued, running, invalid, valid, activated, failed]

    SiteCandidate:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - trigger
        - expectedRuntimeVersion
        - queuedAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SiteCandidateStatus'
        trigger:
          $ref: '#/components/schemas/CandidateTrigger'
        expectedRuntimeVersion:
          type: integer
          minimum: 0
        queuedAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: string
          format: date-time
        snapshotId:
          type: [string, 'null']
          format: uuid

    CandidateTrigger:
      type: object
      additionalProperties: false
      required: [kind, name, revisionId]
      properties:
        kind:
          $ref: '#/components/schemas/ResourceKind'
        name:
          type: string
        revisionId:
          type: string
          format: uuid

    Diagnostic:
      type: object
      additionalProperties: false
      required: [sequence, code, path, message]
      properties:
        sequence:
          type: integer
          minimum: 0
        code:
          type: string
          minLength: 1
        kind:
          oneOf:
            - $ref: '#/components/schemas/ResourceKind'
            - type: 'null'
        name:
          type: [string, 'null']
        revisionId:
          type: [string, 'null']
          format: uuid
        path:
          type: string
        line:
          type: [integer, 'null']
          minimum: 1
        column:
          type: [integer, 'null']
          minimum: 1
        message:
          type: string

    SiteSnapshot:
      type: object
      additionalProperties: false
      required: [id, siteRevisionId, checksum, compilerVersion, createdAt]
      properties:
        id:
          type: string
          format: uuid
        siteRevisionId:
          type: string
          format: uuid
        checksum:
          type: string
          pattern: '^[a-f0-9]{64}$'
        compilerVersion:
          type: string
        createdAt:
          type: string
          format: date-time

    SnapshotResource:
      type: object
      additionalProperties: false
      required: [kind, name, revisionId]
      properties:
        kind:
          $ref: '#/components/schemas/ResourceKind'
        name:
          type: string
        revisionId:
          type: string
          format: uuid

    SiteRuntimeState:
      type: object
      additionalProperties: false
      required: [siteName, activeSnapshotId, version, activatedAt]
      properties:
        siteName:
          type: string
        activeSnapshotId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        activatedAt:
          type: string
          format: date-time

    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable Taskmigo machine-readable error code.
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'

    Violation:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        path:
          type: string
        message:
          type: string

    PageMeta:
      type: object
      additionalProperties: false
      required: [hasMore]
      properties:
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean

    ResourcePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResourceSummary'
        page:
          $ref: '#/components/schemas/PageMeta'

    ResourceRevisionPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResourceRevisionSummary'
        page:
          $ref: '#/components/schemas/PageMeta'

    ResourceTagPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResourceTag'
        page:
          $ref: '#/components/schemas/PageMeta'

    SiteCandidatePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
