name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build static documentation
        run: npm run build
        env:
          VITE_GITHUB_OWNER: ${{ github.repository_owner }}
          VITE_GITHUB_REPO: ${{ github.event.repository.name }}
          VITE_GITHUB_BRANCH: ${{ github.ref_name }}

      - name: Add SPA fallback for direct navigation
        run: |
          mkdir pages-output
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            cp -a build/client/. pages-output/
          else
            # Keep every shared Vite/React Router output (including .nojekyll)
            # before flattening the prerendered basename directory. This avoids
            # having to maintain an incomplete allow-list of client artifacts.
            cp -a build/client/. pages-output/
            cp -a "build/client/${{ github.event.repository.name }}/." pages-output/
            rm -rf "pages-output/${{ github.event.repository.name }}"
          fi
          cp build/client/__spa-fallback.html pages-output/404.html

          test -f pages-output/index.html
          test -f pages-output/.nojekyll
          test -d pages-output/assets

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./pages-output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
